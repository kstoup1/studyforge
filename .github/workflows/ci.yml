name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time only — no real DB needed since these are static/marketing
          # pages at this phase. Real secrets live in Vercel's env vars for deploys.
          DATABASE_URL: "postgres://user:pass@localhost:5432/ci_placeholder"
